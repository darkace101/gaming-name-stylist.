

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esports & Gaming Name Stylist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1> <center>⚡ GAMING NAME STYLIST ⚡</center> </h1>
<p>Generate Free Fire compatible handles, guild tags, and unicode symbols.</p>
</header>

<main>
<!-- Input Section -->
<section class="input-card">
<label for="nameInput">Enter Gaming Name:</label>
<input type="text" id="nameInput" placeholder="e.g. ᴀᴄᴇ·ʟᴏʀᴅ">
</section>

<!-- Symbol Grid -->
<section class="symbols-card">
<h3>Quick Symbols (Click to Add):</h3>
<div class="symbol-grid" id="symbolGrid">
<button class="symbol-btn">༒</button>
<button class="symbol-btn">™</button>
<button class="symbol-btn">⚔️</button>
<button class="symbol-btn">⚡</button>
<button class="symbol-btn">ღ</button>
<button class="symbol-btn">★</button>
<button class="symbol-btn">☠️</button>
<button class="symbol-btn">乄</button>
<button class="symbol-btn">·</button>
<button class="symbol-btn">⚜️</button>
<button class="symbol-btn">✿</button>
<button class="symbol-btn">亗</button>
<button class="symbol-btn">†</button>
<button class="symbol-btn">∆</button>
<button class="symbol-btn">¥</button>
</div>
</section>

<!-- Output Results -->
<section class="output-section">
<h3>Generated Styles:</h3>
<div id="outputContainer" class="output-list"></div>
</section>
</main>

<footer>
<p>Built for Gamers | Hosted on GitHub Pages</p>
</footer>
</div>

<script src="script.js"></script>
</body>
</html>
